<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>COPD GOLD 2026 Assistant</title>
<style>
:root{
  --bg:#eaf6fa;--bg2:#f6fbfd;--card:#fff;--ink:#12283d;--muted:#566b7f;--line:#d3e3ec;
  --teal:#0f8b8d;--aqua:#16b5c2;--blue:#2563eb;--violet:#7c3aed;--coral:#f4715f;
  --green:#1e9e5a;--amber:#d98c06;--red:#d63a2f;--info:#2471a3;--grey:#94a3b8;
  --green-bg:#e6f6ed;--amber-bg:#fff4dc;--red-bg:#fde8e6;--info-bg:#e5f1fa;--grey-bg:#eef2f6;
  --radius:12px;--shadow:0 1px 2px rgba(18,40,61,.06),0 6px 18px rgba(18,40,61,.07);
  --focus:#2563eb;
  --bg3:#fff;--soft:#f3f9fb;--soft2:#e8f0f4;--sel:#e3f6f6;--line2:#b9cfdb;--red-ink:#a92a21;--amber-ink:#7a4c00;--info-ink:#1d5f8a;--green-ink:#0f5132;--teal-ink:#0b5f66;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1620;--bg2:#0e1c27;--bg3:#0e1c27;--card:#13232f;--ink:#e2edf4;--muted:#9db2c2;--line:#25394a;--line2:#33506a;--soft:#172b39;--soft2:#1d3344;--sel:#123d44;--teal:#2bb3b5;--aqua:#3cc9d4;--blue:#5b8cff;--violet:#a585ff;--green:#34c27a;--amber:#f0a92a;--red:#f0675c;--info:#5aa6dc;--grey:#7d8ea3;--green-bg:#123323;--amber-bg:#3a2b0c;--red-bg:#3d1a17;--info-bg:#132c42;--grey-bg:#1e2a36;--red-ink:#ff9d94;--amber-ink:#ffcd6e;--info-ink:#9fd0f5;--green-ink:#8be0b1;--teal-ink:#7fe0e2;--focus:#7aa7ff;--shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1620;--bg2:#0e1c27;--bg3:#0e1c27;--card:#13232f;--ink:#e2edf4;--muted:#9db2c2;--line:#25394a;--line2:#33506a;--soft:#172b39;--soft2:#1d3344;--sel:#123d44;--teal:#2bb3b5;--aqua:#3cc9d4;--blue:#5b8cff;--violet:#a585ff;--green:#34c27a;--amber:#f0a92a;--red:#f0675c;--info:#5aa6dc;--grey:#7d8ea3;--green-bg:#123323;--amber-bg:#3a2b0c;--red-bg:#3d1a17;--info-bg:#132c42;--grey-bg:#1e2a36;--red-ink:#ff9d94;--amber-ink:#ffcd6e;--info-ink:#9fd0f5;--green-ink:#8be0b1;--teal-ink:#7fe0e2;--focus:#7aa7ff;--shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Arabic",Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg) 0,var(--bg2) 380px,var(--bg3) 100%);min-height:100vh}
a{color:var(--blue)}
.skip{position:absolute;left:-999px;top:0;background:var(--card);padding:8px;z-index:99}.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.boot{padding:40px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-word}.grow{flex:1;min-width:0}
.spacer{height:10px}[hidden]{display:none!important}
pre{background:#10243a;color:#e3f1fb;padding:10px 12px;border-radius:8px;overflow:auto}

/* shell */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px;background:linear-gradient(100deg,#0b6e78 0,#0f8b8d 38%,#2563eb 100%);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(11,60,80,.25)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand b{display:block;font-size:16px;line-height:1.1}.brand small{opacity:.85;font-size:11px}
.brand .lung .lobe{fill:rgba(255,255,255,.92)}.brand .lung .trachea,.brand .lung .bronch{stroke:#fff}
.navs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav{display:inline-flex;align-items:center;gap:6px;color:#e8fbff;text-decoration:none;padding:7px 11px;border-radius:9px;font-weight:600;font-size:14px}
.nav:hover{background:rgba(255,255,255,.16)}.nav.active{background:rgba(255,255,255,.26)}
.nav.sos{background:var(--red);color:#fff}.nav.sos:hover{background:#b92f26}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.who .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}.who .btn.ghost:hover{background:rgba(255,255,255,.18)}
.wm-tag{background:rgba(255,255,255,.18);padding:2px 9px;border-radius:99px;font-weight:600}
.foot{max-width:1200px;margin:24px auto;padding:12px 20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
.icon{vertical-align:-3px}

/* layout */
.page{max-width:1200px;margin:0 auto;padding:18px 16px 8px}.page.narrow{max-width:520px}.page.tight{padding-bottom:0}
.wbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.wbar h2,.wbar h3{margin:0}
h1,h2,h3,h4{line-height:1.2}h2{font-size:22px;margin:4px 0 10px}h3{font-size:17px;margin:0 0 8px}h4{font-size:14px;margin:0 0 6px;color:var(--teal)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin:12px 0}
.btns{display:flex;gap:6px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.toolbar input[type=search]{flex:1;min-width:200px}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;min-height:38px}
.btn:hover{background:var(--soft);border-color:var(--line2)}
.btn.primary{background:linear-gradient(100deg,var(--teal),var(--blue));color:#fff;border-color:transparent}.btn.primary:hover{filter:brightness(1.07)}
.btn.sos{background:var(--red);color:#fff;border-color:transparent}.btn.sos:hover{background:#b92f26}
.btn.ghost{background:transparent}.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}.btn.lg{padding:12px 20px;font-size:16px}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;min-height:38px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
textarea{resize:vertical}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.lbl{font-weight:600;font-size:13px;color:var(--ink)}.unit{font-weight:400;color:var(--muted)}
.inp{position:relative}.inp .suffix{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.inp input{padding-right:62px}
.warnline{color:var(--amber);font-size:12px;min-height:0}.warnline:empty{display:none}
.help{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 16px}
.field.wide{grid-column:1/-1}
fieldset.field{border:0;padding:0;margin:0}
.segs{display:flex;gap:0;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg{flex:1;border:0;background:var(--card);padding:7px 4px;font:inherit;font-size:13px;cursor:pointer;border-left:1px solid var(--line)}.seg:first-child{border-left:0}
.seg.on{background:var(--grey-bg);font-weight:700}.seg.on.yes{background:var(--green);color:#fff}.seg.on.no{background:#566b7f;color:#fff}
.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:14px}.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 14px}
.mmrc{display:grid;gap:6px}.mm{display:flex;gap:10px;text-align:left;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:8px 10px;cursor:pointer;font:inherit}
.mm b{background:var(--teal);color:#fff;border-radius:6px;min-width:24px;text-align:center}.mm.on{border-color:var(--teal);background:var(--sel);box-shadow:inset 0 0 0 1px var(--teal)}
.cat{display:grid;gap:8px}.cat-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:12.5px}
.cat-row .cr{text-align:right}.cbs{display:flex;gap:3px}
.cb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font:inherit;cursor:pointer}.cb.on{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;border-color:transparent;font-weight:700}
.cat-total{font-weight:700;color:var(--teal);margin-top:4px}
@media(max-width:700px){.cat-row{grid-template-columns:1fr;text-align:center}.cat-row .cr{text-align:center}.cbs{justify-content:center}}
.rowitem{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px dashed var(--line2);border-radius:9px;margin-bottom:8px}.rowitem .grid{flex:1}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:10px 0;padding:0 14px 14px}
details.sec>summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--teal);list-style:none;display:flex;gap:8px;align-items:center}
details.sec>summary::before{content:"▸";transition:transform .15s}details.sec[open]>summary::before{transform:rotate(90deg)}
.sec-hint{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}

/* workbench */
.wbgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.wbres{position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto;padding-right:2px}
@media(max-width:980px){.wbgrid{grid-template-columns:1fr}.wbres{position:static;max-height:none}}
.pchip{display:inline-flex;gap:6px;align-items:center;background:var(--sel);color:var(--teal-ink);padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}.pchip small{font-weight:400;opacity:.8}
.help-top{margin:0 0 8px}
.sosbar{background:var(--red);color:#fff;padding:9px 14px;border-radius:10px;margin-bottom:10px}
.page.emerg .wbres .rhead{font-size:105%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--muted)}
.tab.on{background:linear-gradient(100deg,var(--teal),var(--blue));color:#fff;border-color:transparent}
.tab.t-acute.on{background:linear-gradient(100deg,#e2573f,#f4715f)}.tab.t-oxygen.on{background:linear-gradient(100deg,#2563eb,#7c3aed)}

/* results */
.result{display:grid;gap:10px}
.rhead{border-radius:var(--radius);padding:12px 14px;color:#fff;background:linear-gradient(100deg,#2471a3,#16b5c2)}
.rhead.lv-green{background:linear-gradient(100deg,#1e9e5a,#2cc17b)}.rhead.lv-amber{background:linear-gradient(100deg,#c97e00,#f0a81f)}.rhead.lv-red{background:linear-gradient(100deg,#c0261c,#f4715f)}.rhead.lv-grey{background:linear-gradient(100deg,#64748b,#94a3b8)}
.rtitle{font-size:12px;text-transform:uppercase;letter-spacing:.05em;opacity:.9}.rbig{font-size:19px;font-weight:700;line-height:1.25}.rstat{font-size:12px;margin-top:4px;opacity:.95}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.rcard ul,.rcard ol,.result ul{margin:4px 0 4px 18px;padding:0}.rcard li{margin:2px 0}
.redbox{background:var(--red-bg);border:1px solid #f1b3ae;border-left:5px solid var(--red);padding:10px 12px;border-radius:9px;color:var(--red-ink)}
.ambbox{background:var(--amber-bg);border:1px solid #f0d28e;border-left:5px solid var(--amber);padding:10px 12px;border-radius:9px;color:var(--amber-ink)}
.okbox{background:var(--green-bg);border:1px solid #a9dcc0;border-left:5px solid var(--green);padding:10px 12px;border-radius:9px;color:var(--green-ink)}
.warnl li{color:var(--amber-ink)}
.flags{display:grid;gap:5px}.flag{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:6px 10px;border-radius:8px;background:var(--info-bg)}
.flag.f-red{background:var(--red-bg)}.flag.f-amber{background:var(--amber-bg)}
.fdot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--info)}.f-red .fdot{background:var(--red)}.f-amber .fdot{background:var(--amber)}
.f-red{color:var(--red-ink)}.f-amber{color:var(--amber-ink)}.f-info{color:var(--info-ink)}
.kv{width:100%;border-collapse:collapse;font-size:14px}.kv th{width:30%;text-align:left;color:var(--muted);font-weight:600;vertical-align:top;padding:5px 8px 5px 0;border-top:1px solid var(--line)}.kv td{padding:5px 0;border-top:1px solid var(--line)}
.sources{font-size:12.5px;color:var(--muted)}.sources summary{cursor:pointer}.sources li{margin:3px 0}
.src-k{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;color:#fff;background:var(--grey)}.k-gold{background:var(--teal)}.k-other{background:var(--violet)}.k-app{background:#64748b}
.pg{color:var(--muted)}
.disc{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.pill{background:var(--sel);color:var(--teal-ink);border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600}
.pill.big{font-size:14px;color:#fff;padding:3px 14px}.pill.big.lv-green{background:var(--green)}.pill.big.lv-amber{background:var(--amber)}.pill.big.lv-red{background:var(--red)}
.badge{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;color:#fff}.b-green{background:var(--green)}.b-amber{background:var(--amber)}.b-red{background:var(--red)}.b-info{background:var(--info)}.b-grey{background:var(--grey)}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.cand{border:1px solid var(--line);border-radius:9px;padding:8px;font-size:13px;background:var(--card)}.cand.ok{border-color:#a9dcc0;background:var(--green-bg)}.cand.no{opacity:.65;background:var(--grey-bg)}.cand.warn{border-color:#f0d28e;background:var(--amber-bg)}.cand small{display:block;color:var(--muted)}.cand p{margin:4px 0 0}
.viz-row{display:flex;gap:12px;align-items:center}
.redbox ul{margin:4px 0 0 18px}

/* svg bits */
.lung .lobe{fill:#bfe9ee;stroke:#0f8b8d;stroke-width:1.5}.lung .trachea,.lung .bronch{stroke:#0f8b8d}
.lung.g1 .lobe{fill:#bfe8cf;stroke:#1e9e5a}.lung.g2 .lobe{fill:#e9f2b0;stroke:#9bb21a}.lung.g3 .lobe{fill:#fbd998;stroke:#d98c06}.lung.g4 .lobe{fill:#f6b0a8;stroke:#d63a2f}
.c-green{fill:var(--green)}.c-amber{fill:var(--amber)}.c-red{fill:var(--red)}.c-info{fill:var(--info)}.c-grey{fill:var(--grey)}
.chart{width:100%;height:auto;max-height:230px}.chart .ax,.abgmap .ax,.bode .ax{font-size:9px;fill:var(--muted)}.chart .val{font-size:10px;font-weight:700;fill:var(--ink)}
.chart .grid-l,.abgmap .grid-l{stroke:var(--line);stroke-width:1}.chart .ln{stroke:var(--teal);stroke-width:2.2}.chart .dot{fill:var(--blue)}.chart .band-ref{fill:rgba(30,158,90,.12)}
.abgmap{width:100%;max-width:420px}.abgmap .zone-niv{fill:rgba(214,58,47,.12)}.abgmap .zone-norm{fill:rgba(30,158,90,.22)}.abgmap .zl{font-size:8px;fill:var(--red-ink)}.abgmap .zl.norm{fill:var(--green-ink)}.abgmap .pt{fill:var(--blue);stroke:#fff;stroke-width:2}
.bode{width:100%;max-width:420px}.bode .band{opacity:.85}.bode .mark{fill:var(--ink)}.bode .mk{font-size:10px;font-weight:700;fill:var(--ink)}

/* ABE etc */
.abe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.abe-box{border-radius:12px;padding:10px;color:#fff;border:2px solid transparent;opacity:.95}
.abe-box.lv-green{background:var(--green)}.abe-box.lv-amber{background:var(--amber)}.abe-box.lv-red{background:var(--red)}
.abe-box.off{opacity:.3;filter:grayscale(.4)}.abe-box.on{box-shadow:0 0 0 4px rgba(18,40,61,.25);transform:scale(1.02)}
.abe-g{font-size:34px;font-weight:800;line-height:1}.abe-t{font-weight:700}.abe-d{font-size:12px;opacity:.95}.abe-none{grid-column:1/-1;color:var(--muted);font-size:13px}
@media(max-width:560px){.abe{grid-template-columns:1fr}}
.gradebar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:1}.gb{border-radius:9px;padding:6px 8px;text-align:center;background:var(--grey-bg);opacity:.6;font-size:12px}.gb b,.gb span,.gb small{display:block}
.gb.g1{background:#d6f1e0}.gb.g2{background:#eef5c4}.gb.g3{background:#fde6b4}.gb.g4{background:#f9c5bf}.gb.on{opacity:1;box-shadow:0 0 0 3px var(--ink)}.gb-note{grid-column:1/-1;font-size:12px;color:var(--muted)}
.abcde{display:grid;gap:6px}.abcde-i{display:flex;gap:10px;border-radius:10px;padding:8px 10px;background:var(--green-bg);border-left:6px solid var(--green)}
.abcde-i.lv-amber{background:var(--amber-bg);border-color:var(--amber)}.abcde-i.lv-red{background:var(--red-bg);border-color:var(--red)}
.abcde-l{font-size:26px;font-weight:800;width:30px;text-align:center}.abcde-b ul{margin:2px 0 0 16px;padding:0}.abcde-b small{color:var(--muted)}
.rome{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px}.rome-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chip{display:inline-block;margin:2px;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:var(--card)}.chip.on{background:var(--red-bg);border-color:#f1b3ae;color:var(--red-ink);font-weight:700}.chip.off{background:var(--green-bg)}.chip.unk{background:var(--grey-bg);color:var(--muted)}
.flow-r{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card);flex-wrap:wrap}.flow-r.on{border-color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal)}
.flow-g{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}.flow-g.lv-green{background:var(--green)}.flow-g.lv-amber{background:var(--amber)}.flow-g.lv-red{background:var(--red)}.flow-sel{margin-left:auto;font-size:12px;font-weight:700;color:var(--teal)}
.tree .node{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card);margin:5px 0;font-size:13.5px;opacity:.6}.tree .node.on{opacity:1;border-width:2px}.tree .node.on.lv-amber{border-color:var(--amber);background:var(--amber-bg)}.tree .node.on.lv-green{border-color:var(--green);background:var(--green-bg)}.tree .node.on.lv-info{border-color:var(--info);background:var(--info-bg)}.tree-b{margin-left:18px;border-left:3px solid var(--line);padding-left:10px}

/* traffic lights */
.tl{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--grey);box-shadow:inset 0 -3px 5px rgba(0,0,0,.2),0 0 0 2px #fff,0 0 0 3px var(--line);flex:none}
.tl.lv-green{background:var(--green)}.tl.lv-amber{background:var(--amber)}.tl.lv-red{background:var(--red)}.tl.lv-info{background:var(--info)}
.lights{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}.lt{display:flex;gap:10px;align-items:center}.lt small{display:block;color:var(--muted)}.lights .wide{grid-column:1/-1}

/* lists */
.plist{display:grid;gap:8px}.prow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}.prow:hover{border-color:var(--aqua)}
.prow small{display:block;color:var(--muted)}.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--aqua),var(--violet));color:#fff;display:grid;place-items:center;font-weight:700}

    recommendations: recs,

      repeatedPneumonia: input.severeOrRecurrentPneumonia === true, mycobacterialInfection: input.mycobacterialInfection === true,

function treatmentPlan(input = {}) {
  const cur = input.currentRegimen;
  if (!cur || cur === 'none' || cur === 'SABA' || input.alreadyOnMaintenance === false) return initialTreatment({ ...input, alreadyOnMaintenance: false });

exports.initialTreatment = initialTreatment;
exports.followUpTreatment = followUpTreatment;
exports.treatmentPlan = treatmentPlan;
exports.REGIMENS = REGIMENS;
exports.hasIcs = hasIcs;

const DRUG_TABLE_NOTE = 'GOLD 2026 Fig A3.1 (p.145). MDI = metered-dose inhaler; DPI = dry-powder inhaler; SMI = soft-mist inhaler. † Dosing regimens under discussion. Not exhaustive; not all formulations are available in all countries. Doses are not given: use local product information.';

/** formulary config: { [drugId]: { available: boolean, brand?: string, note?: string } }; missing = available (default). */
function isAvailable(drug, formulary = {}) {
  const f = formulary[drug.id];
  return f ? f.available !== false : true;
}

/** Drugs that can deliver a regimen class, with local availability applied. */
function optionsForRegimen(regimenKey, formulary = {}) {
  const keys = String(regimenKey).split('|');
  const matches = DRUGS.filter((x) => keys.includes(x.regimenKey) && x.class !== 'SAMA' && x.class !== 'SABA+SAMA');
  const available = matches.filter((x) => isAvailable(x, formulary));
  return { all: matches, available, unavailable: matches.filter((x) => !isAvailable(x, formulary)) };
}

/**
 * Medication comparison table rows with local formulary applied and optional device filter.
 * filter: { regimenKey?, device?, onceDaily?, singleInhalerOnly?, availableOnly? }
 */
function compareDrugs(formulary = {}, filter = {}) {
  let rows = DRUGS.map((x) => ({ ...x, available: isAvailable(x, formulary), brand: formulary[x.id]?.brand || '', localNote: formulary[x.id]?.note || '' }));
  if (filter.regimenKey) rows = rows.filter((x) => String(filter.regimenKey).split('|').includes(x.regimenKey));
  if (filter.device) rows = rows.filter((x) => x.devices.includes(filter.device) || (filter.device === 'NEB' && x.nebulizer));
  if (filter.onceDaily) rows = rows.filter((x) => x.frequency === 'Once daily');
  if (filter.singleInhalerOnly) rows = rows.filter((x) => x.singleInhaler);
  if (filter.availableOnly) rows = rows.filter((x) => x.available);
  return rows;
}

const DRUG_CLASS_ORDER = ['SABA', 'SAMA', 'SABA+SAMA', 'LABA', 'LAMA', 'LABA+LAMA', 'LABA+ICS', 'LABA+LAMA+ICS', 'Methylxanthine', 'PDE4 inhibitor', 'PDE3/4 inhibitor', 'Mucolytic', 'Biologic'];

exports.isAvailable = isAvailable;
exports.optionsForRegimen = optionsForRegimen;
exports.compareDrugs = compareDrugs;
exports.DRUGS = DRUGS;
exports.DRUG_TABLE_NOTE = DRUG_TABLE_NOTE;
exports.DRUG_CLASS_ORDER = DRUG_CLASS_ORDER;
},

  const pneum = [];

  if (input.fever && input.purulentSputum) pneum.push('Fever with purulent sputum');
  add('pneumonia', 'Pneumonia', m.cxrConsolidation ? 'high' : pneum.length ? 'possible' : 'low', pneum, ['Chest X-ray or CT', 'Lung ultrasound', 'Viral and bacterial microbiology']);
  const ptx = [];
  if (m.cxrPneumothorax) ptx.push('Pneumothorax on imaging');
  if (m.pleuriticPain || m.suddenOnset) ptx.push('Sudden-onset / pleuritic pain');
  add('pneumothorax', 'Pneumothorax', m.cxrPneumothorax ? 'high' : ptx.length ? 'possible' : 'low', ptx, ['Chest X-ray or CT', 'Thoracic ultrasound']);
  const hf = [];
  if (m.cxrPulmonaryOedema) hf.push('Pulmonary oedema / dilated heart on imaging');
  if (m.bnpRaised) hf.push('Raised natriuretic peptide');
  if (m.edema || m.orthopnoea) hf.push('Oedema / orthopnoea');
  add('heartFailure', 'Acute heart failure', (m.cxrPulmonaryOedema || m.bnpRaised) ? 'high' : hf.length ? 'possible' : 'low', hf, ['Chest X-ray or CT', 'NT-proBNP / BNP', 'Cardiac ultrasound']);
  const arr = [];
  const rhythm = (input.circulation || {}).rhythm;
  if (m.ecgArrhythmia || (rhythm && rhythm !== 'sinus')) arr.push('Arrhythmia (e.g. atrial flutter/fibrillation) on ECG/pulse');

  const acs = [];

  if (m.troponinRaised) acs.push('Raised troponin (stable COPD often has chronically raised hs-troponin: look for a dynamic rise/fall; GOLD p.116)');
  if (m.chestPain) acs.push('Chest pain');

  const pe = [];
  if (m.hemoptysis) pe.push('Haemoptysis');
  if (m.dvtSigns) pe.push('Signs of DVT');
  if (m.cancerHistory) pe.push('History of cancer');
  if (m.recentSurgery) pe.push('Recent surgery/fracture');
  if (m.immobilisation) pe.push('Immobilisation');
  if (m.ddimerRaised) pe.push('Raised D-dimer');
  add('pe', 'Pulmonary embolism', pe.length >= 2 ? 'possible' : pe.length ? 'possible' : 'low', pe, ['Clinical probability assessment (haemoptysis, DVT, cancer, surgery, fracture)', 'D-dimer', 'CT pulmonary angiography']);

/* ---------------- master ---------------- */

/* ---------------- discharge readiness (Fig 4.10) ---------------- */

    ['maintenanceChecked', 'Maintenance therapy checked (patients with elevated blood eosinophils should be discharged on LABA+LAMA+ICS; Fig 4.10)'],

exports.romeSeverity = romeSeverity;
exports.hospitalClass = hospitalClass;
exports.oxygenAdvice = oxygenAdvice;
exports.nivAssessment = nivAssessment;
exports.nivFailure = nivFailure;

// Per-browser learning progress. Storage may be unavailable; everything degrades to in-memory.
const KEY = 'copd.learn.v1';
let mem = null;
function load() {
  if (mem) return mem;
  try { mem = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { mem = null; }
  mem ||= { modules: {}, cases: {}, quiz: {} };
  return mem;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch { /* storage blocked */ } }

const progress = {
  get: () => load(),
  visitModule(id) { load().modules[id] = new Date().toISOString(); save(); },
  caseAnswer(caseId, qi, correct) { const c = (load().cases[caseId] ||= { answers: {} }); c.answers[qi] = correct; save(); },
  caseDone(caseId) { const c = (load().cases[caseId] ||= { answers: {} }); c.done = new Date().toISOString(); save(); },
  quizAnswer(id, correct) { load().quiz[id] = { correct, at: new Date().toISOString() }; save(); },
  resetQuiz() { load().quiz = {}; save(); },

      cases: Object.values(p.cases).filter((c) => c.done).length, casesTotal: totals.cases,
      quizAnswered: q.length, quizCorrect: q.filter((x) => x.correct).length, quizTotal: totals.quiz,

  },
};

},

function search(q, limit = 30) {
  INDEX ||= buildIndex();
  const STOP = new Set(['the', 'and', 'for', 'with', 'what', 'when', 'which', 'who', 'how', 'should', 'does', 'do', 'is', 'are', 'be', 'in', 'of', 'to', 'a', 'an', 'or', 'on', 'my', 'i', 'can', 'we', 'it', 'about', 'between', 'choose', 'patient', 'patients', 'copd']);
  const terms = q.toLowerCase().replace(/[?.,!]/g, ' ').split(/\s+/).filter((t) => t.length > 1 && !STOP.has(t)).map((t) => (t.length > 6 ? t.slice(0, Math.max(6, t.length - 3)) : t.length > 4 ? t.replace(/(s|ed)$/, '') : t));

  const need = terms.length <= 2 ? terms.length : Math.ceil(terms.length * 0.6);
  const scored = [];
  for (const it of INDEX) {
    const title = it.title.toLowerCase(), body = `${it.sub || ''} ${it.text}`.toLowerCase();
    let sc = 0, hit = 0;
    for (const t of terms) { if (title.includes(t)) { sc += 5; hit++; } else if (body.includes(t)) { sc += 1; hit++; } }
    if (hit >= need) scored.push([sc + (it.type === 'Module' ? 2 : 0) + hit * 2, it]);
  }
  return scored.sort((a, b) => b[0] - a[0]).slice(0, limit).map((x) => x[1]);
}
function snippet(text, q, len = 150) {
  const t = String(text || '');
  const i = t.toLowerCase().indexOf(q.toLowerCase().split(/\s+/)[0] || '');
  const s0 = Math.max(0, i - 40);
  return (s0 ? '…' : '') + t.slice(s0, s0 + len) + (t.length > s0 + len ? '…' : '');
}

  if (summary) {
